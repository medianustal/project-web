<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Bangun Ruang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Kalkulator Bangun Ruang</h1>
      <p>Pilih bangun ruang, isi ukurannya, lalu hitung volume dan luas permukaannya.</p>
    </header>

    <!-- Tombol pilihan bangun ruang (diisi otomatis oleh script.js) -->
    <nav id="daftarBangun" class="daftar-bangun" aria-label="Pilih bangun ruang"></nav>

    <!-- Form input (kolom diisi otomatis sesuai bangun yang dipilih) -->
    <section class="kartu">
      <h2 id="judulBangun"></h2>
      <p id="rumusBangun" class="rumus"></p>

      <form id="formHitung" novalidate>
        <div id="kolomInput" class="kolom-input"></div>
        <p id="pesanError" class="error" role="alert"></p>
        <div class="aksi">
          <button type="submit" class="tombol utama">Hitung</button>
          <button type="button" id="tombolReset" class="tombol">Reset</button>
        </div>
      </form>
    </section>

    <!-- Hasil dalam bentuk teks (hasil juga muncul lewat alert) -->
    <section class="kartu hasil" id="areaHasil" aria-live="polite">
      <h2>Hasil</h2>
      <p id="teksHasil">Belum ada perhitungan.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
